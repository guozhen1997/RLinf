defaults:
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_sft_gr00t_n1d7_robottt"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 50000
  val_check_interval: -1
  save_interval: 2000
  log_interval: 50
  resume_dir: null

data:
  train_data_paths: /path/to/libero-lerobot
  num_workers: 4
  prefetch_factor: 2
  video_backend: torchcodec
  robottt:
    num_timesteps: 16
    # Paired first-person human video in LeRobot format. Leave unset to train
    # on robot trajectories only; when set, the human segment is loss-masked
    # and used only to update TTT fast weights (in-context one-shot).
    human_video_path: null
    human_video_timesteps: 0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42

  model:
    model_type: "gr00t_n1d7"
    precision: bf16
    model_path: /path/to/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /path/to/Cosmos-Reason2-2B
    embodiment_tag: libero_sim
    add_value_head: False
    num_action_chunks: 16
    denoising_steps: 4
    # Truncated BPTT segment length in timesteps. 0 means full-sequence BPTT.
    tbptt_segment_length: 8
    rl_head_config:
      use_ttt: True
      add_value_head: False
      disable_dropout: True
      ttt:
        fast_model: mlp
        num_register_tokens: 16
        context_tokens: register
        # Freeze the pretrained DiT / backbone and train only TTT + registers,
        # matching the paper's pretraining stage.
        train_ttt_only: True
        gate_init: 0.001
        base_lr: 0.1

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 500
    total_training_steps: 50000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
